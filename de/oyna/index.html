ren\":[[\"$\",\"div\",null,{\"className\":\"mb-6 text-center\",\"children\":[[\"$\",\"span\",null,{\"className\":\"font-mono text-[11px] tracking-[0.42em] text-neon-cyan uppercase\",\"children\":\"3D SPIELBARE DEMO\"}],[\"$\",\"h1\",null,{\"className\":\"mt-3 font-display text-3xl font-black tracking-[0.08em] text-ghost md:text-5xl\",\"children\":\"NEON-STRASSEN\"}]]}],[\"$\",\"$L12\",null,{\"game\":{\"eyebrow\":\"3D SPIELBARE DEMO\",\"title\":\"NEON-STRASSEN\",\"tagline\":\"Erkunde die Neonstraßen von LUMENFALL in der Ego-Perspektive. Kein Ziel, keine Jagd – streife frei durch die lebendige Stadt im Regen, ihren Luftverkehr und ihre Menschenmengen.\",\"choose\":\"Wähle deinen Charakter\",\"start\":\"IN DIE STADT\",\"restart\":\"NEU\",\"controls\":\"WASD gehen · Maus / Ziehen umsehen · Shift rennen\",\"distance\":\"DISTANZ\",\"lumen\":\"LÜMEN\",\"best\":\"REKORD\",\"threat\":\"PANOPT\",\"score\":\"PUNKTE\",\"gameOver\":\"ERWISCHT\",\"gameOverHint\":\"PANOPT hat dich registriert. Die Stadt vergisst nie — versuch es erneut.\",\"newBest\":\"NEUER REKORD\",\"backHome\":\"LUMENFALL\",\"cleared\":\"BEZIRK GESÄUBERT\"},\"characters\":[{\"id\":\"mara\",\"name\":\"Mara Vex\",\"role\":\"Netrunnerin\",\"tagline\":\"Sucht ihren gelöschten Bruder.\",\"quote\":\"Alles Gelöschte hinterlässt irgendwo eine Spur. Ich sammle die Spuren.\",\"bio\":\"Auf dem Schattenmarkt kostet Daten mehr als Blut — und Mara ist seine teuerste Diebin. Mit sechzehn knackte sie ihren ersten Erinnerungstresor; mit achtundzwanzig war ihr Name in PANOPTs geschützten Schichten eine Legende und ihr Gesicht ein Gerücht. Dann wurde eines Nachts ihr Bruder Deniz aus dem System gelöscht — und aus jedem Gedächtnis der Stadt. Als ihre Mutter sein Foto ansah und fragte, \\\"wer ist dieser Junge?\\\", schwor Mara einen Eid: Wer Menschen vergessen lässt, bekommt etwas, das er nie vergessen wird.\",\"playstyle\":\"Stealth · Hacking · Social Engineering — für Spieler, die die Stadt ungesehen zerlegen. Jede Kamera ein Auge, jedes Implantat eine Tür, jedes Geheimnis eine Waffe.\"},{\"id\":\"kaan\",\"name\":\"Kaan “Ghost” Demir\",\"role\":\"Ex-Vollstrecker\",\"tagline\":\"Der Mann, der dem System entkam.\",\"quote\":\"Laut den offiziellen Akten bin ich tot. Akten lügen immer.\",\"bio\":\"Zwanzig Jahre lang \\\"löste er Probleme\\\" im Schatten des Compact — er brachte jene zum Schweigen, die die falschen Fragen stellten. Dann war die Person, die er zum Schweigen bringen sollte, eines Nachts ein Kind. Er weigerte sich; am Morgen führten die Akten ihn als \\\"operativen Verlust\\\". In den verrosteten Fabriken des Rostgürtels baute er sich ein Leben, still wie ein Sarg. Doch selbst Geister finden in Lumenfall keinen Frieden: Alte Akten öffnen sich, alte Namen kehren zurück — und Ghost steigt aus seinem Grab, um abzurechnen.\",\"playstyle\":\"Taktischer Kampf · schwere Waffen · Erstürmung — für Spieler, die Türen eintreten statt anzuklopfen. Jede Deckung eine Entscheidung, jeder Abzug ein Geständnis.\"},{\"id\":\"solene\",\"name\":\"Solene Adeyemi\",\"role\":\"Orbital-Schmugglerin\",\"tagline\":\"Die Gesetzlose Königin des Himmels.\",\"quote\":\"Schwerkraft ist ein Vorschlag. Der Zoll ein Witz. Aber mein Wort ist ein Vertrag.\",\"bio\":\"Mit acht zählte sie Sterne aus dem Frachtshuttle ihres Vaters; mit achtzehn war sie Aufstiegs jüngste lizenzierte Pilotin; mit einundzwanzig verbrannten sie ihre Lizenz — weil sie statt einer verbotenen Kiste eine geflüchtete Familie transportierte. Jetzt lebt sie im Cockpit des Schwarzen Storchs, in der grauen Leere zwischen Straße und Orbit. Bis ein Container das gefährlichste Geheimnis der Stadt preisgibt — und das Schicksal von ganz Lumenfall in den Händen der Frau landet, die niemals fällt.\",\"playstyle\":\"Tempo · Fahrzeugbeherrschung · unmögliche Fluchten — für Spieler, die die Verfolgungsjagd jagen. Sturzflüge durch Neonschluchten, Zero-G-Manöver im Orbit.\"}],\"backHref\":\"/de\"}]]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"me
