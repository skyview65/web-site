[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-flow"
version = "0.1.0"
description = "Tamamen yerel, gizlilik odaklı Wispr Flow alternatifi: global hotkey ile her uygulamada dikte"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "faster-whisper>=1.0.0",
  "sounddevice>=0.4.6",
  "numpy>=1.24",
  "pynput>=1.7.6",
  "pyperclip>=1.8.2",
]

[project.optional-dependencies]
# Sistem tepsisi (system tray) modu: konsol penceresi açmadan arka planda çalışma.
tray = ["pystray>=0.19.5", "Pillow>=10.0.0"]

[project.scripts]
local-flow = "local_flow.__main__:main"

[project.gui-scripts]
# Windows'ta bu giriş noktasının .exe'si pythonw ile üretilir: konsol açmaz.
local-flow-tray = "local_flow.tray:main"

[tool.setuptools.packages.find]
include = ["local_flow*"]
