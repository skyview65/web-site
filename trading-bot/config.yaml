# ── Yerel AI Trading Bot yapılandırması ──────────────────────────────
# Tüm ayarlar bu dosyadan yönetilir. API anahtarı yalnızca canlı (live)
# emir modu için gerekir ve .env dosyasından okunur.

data:
  source: ccxt            # ccxt (gerçek borsa verisi) | synthetic (çevrimdışı demo)
  exchange: binance       # ccxt borsa kimliği (binance, kraken, coinbase, ...)
  symbols:
    - BTC/USDT
  timeframe: 1h           # 15m | 1h | 4h | 1d
  lookback_days: 1460     # eğitim için indirilecek geçmiş (gün)
  cache_dir: data         # OHLCV parquet önbelleği

labels:                   # Triple-barrier etiketleme (López de Prado)
  atr_period: 14
  tp_atr: 2.0             # kâr-al bariyeri = giriş + 2.0 x ATR
  sl_atr: 1.5             # zarar-kes bariyeri = giriş - 1.5 x ATR
  max_holding: 24         # dikey bariyer (bar sayısı)

model:
  seeds: [7, 42, 2024]    # tohum topluluğu (ensemble) — varyansı düşürür
  n_splits: 6             # walk-forward dilim sayısı
  embargo: 48             # eğitim/test arasında temizlenen bar (sızıntı önleme)
  min_train_bars: 3000
  threshold: 0.60         # işlem açmak için gereken minimum olasılık
  auto_threshold: true    # eşiği OOS backtest Sharpe'ına göre otomatik seç
  lgbm:
    n_estimators: 800
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 60
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    class_weight: balanced
    verbosity: -1

backtest:
  fee_bps: 10.0           # işlem başına komisyon (baz puan, taraf başına)
  slippage_bps: 5.0       # kayma tahmini (baz puan)
  initial_cash: 10000.0

risk:
  risk_per_trade: 0.01        # her işlemde riske edilen sermaye oranı
  max_position_pct: 0.25      # tek pozisyonun sermayeye azami oranı
  max_drawdown_pct: 0.20      # bu düşüşte bot kendini durdurur (kill switch)
  daily_loss_limit_pct: 0.05  # günlük zarar limiti

models_dir: models
state_dir: state
