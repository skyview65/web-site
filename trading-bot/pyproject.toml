[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-trading-bot"
version = "0.1.0"
description = "Local-first ML trading bot: LightGBM + triple-barrier labels + walk-forward validation"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "ccxt>=4.3",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "pyarrow>=15.0",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["bot"]
