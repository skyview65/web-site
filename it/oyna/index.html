dre ha guardato la foto chiedendo \\\"chi è questo ragazzo?\\\", Mara ha giurato: chi fa dimenticare riceverà qualcosa che non potrà mai dimenticare.\",\"playstyle\":\"Furtività · hacking · ingegneria sociale — per chi smonta la città senza farsi vedere. Ogni telecamera un occhio, ogni impianto una porta, ogni segreto un'arma.\"},{\"id\":\"kaan\",\"name\":\"Kaan “Ghost” Demir\",\"role\":\"Ex sicario\",\"tagline\":\"L'uomo che è sfuggito al sistema.\",\"quote\":\"Secondo i registri ufficiali sono morto. I registri mentono sempre.\",\"bio\":\"Per vent'anni ha \\\"risolto problemi\\\" all'ombra del Compact, mettendo a tacere chi faceva le domande sbagliate. Poi una notte la persona da zittire era un bambino. Si è rifiutato; al mattino i registri lo davano per \\\"perdita operativa\\\". Nelle fabbriche arrugginite della Cintura di Ruggine si è costruito una vita silenziosa come una bara. Ma nemmeno i fantasmi trovano pace a Lumenfall: i vecchi fascicoli si riaprono, i vecchi nomi ritornano — e Ghost esce dalla tomba per presentare il conto.\",\"playstyle\":\"Combattimento tattico · armi pesanti · irruzione — per chi sfonda le porte invece di bussare. Ogni copertura è una decisione, ogni grilletto una confessione.\"},{\"id\":\"solene\",\"name\":\"Solene Adeyemi\",\"role\":\"Contrabbandiera orbitale\",\"tagline\":\"La regina fuorilegge del cielo.\",\"quote\":\"La gravità è un suggerimento. La dogana una barzelletta. Ma la mia parola è un contratto.\",\"bio\":\"A otto anni contava le stelle dalla navetta cargo del padre; a diciotto era la pilota patentata più giovane di Ascesa; a ventuno le hanno bruciato la licenza — per aver trasportato una famiglia di rifugiati al posto di una cassa proibita. Ora vive nella cabina della Cicogna Nera, nel vuoto grigio tra strada e orbita. Finché un container non rivela il segreto più pericoloso della città — e il destino di tutta Lumenfall finisce nelle mani della donna che non cade mai.\",\"playstyle\":\"Velocità · padronanza dei veicol
