문에. 지금은 '검은 황새'의 조종석에서, 거리와 궤도 사이 회색 공백을 살아간다. 어느 날 컨테이너 하나가 도시에서 가장 위험한 비밀을 쏟아내기 전까지는 — 그리고 루멘폴 전체의 운명이, 결코 추락하지 않는 여자의 손에 떨어진다.\",\"playstyle\":\"속도 · 기체 조종술 · 불가능한 탈출 — 추격전 그 자체를 쫓는 플레이어를 위해. 네온 협곡 급강하, 궤도 무중력 기동.\"}],\"backHref\":\"/ko\"}]]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:I[27201,[\"/web-site/_next/static/chunks/01xlw8hd842-c.js\",\"/web-site/_next/static/chunks/0d3shmwh5_nmn.js\"],\"IconMark\"]\n8:null\n"])</script><script>self.__next_f.push([1,"d:[[\"$\",\"title\",\"0\",{\"children\":\"LUMENFALL — 어둠이 빛나다 · 2099\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"2099년. AI가 통치하는 메가시티 루멘폴에서 교차하는 세 개의 삶, 하나의 운명. 거리에서 궤도까지 이어지는 오픈월드 범죄 대서사시. 2027년 출시 예정.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/web-site/seo/site.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://lumenfall.example.com/ko/\"}],[\"$\",\"link\",\"4\",{\"rel\":\"alternate\",\"hrefLang\":\"tr\",\"href\":\"https://lumenfall.example.com/tr/\"}],[\"$\",\"link\",\"5\",{\"rel\":\"alternate\",\"hrefLang\":\"en\",\"href\":\"https://lumenfall.example.com/en/\"}],[\"$\",\"link\",\"6\",{\"rel\":\"alternate\",\"hrefLang\":\"de\",\"href\":\"https://lumenfall.example.com/de/\"}],[\"$\",\"link\",\"7\",{\"rel\":\"alternate\",\"hrefLang\":\"fr\",\"href\":\"https://lumenfall.example.com/fr/\"}],[\"$\",\"link\",\"8\",{\"rel\":\"alternate\",\"hrefLang\":\"es\",\"href\":\"https://lumenfall.example.com/es/\"}],[\"$\",\"link\",\"9\",{\"rel\":\"alternate\",\"hrefLang\":\"it\",\"href\":\"https://lumenfall.example.com/it/\"}],[\"$\",\"link\",\"10\",{\"rel\":\"alternate\",\"hrefLang\":\"pt\",\"href\":\"https://lumenfall.example.com/pt/\"}],[\"$\",\"link\",\"11\",{\"rel\":\"alternate\",\"hrefLang\":\"ru\",\"href\":\"https://lumen
