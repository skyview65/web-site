name: Deploy to GitHub Pages

# Pages, gh-pages dalından yayınlanıyor (Settings > Pages kaynağı: gh-pages).
# Actions API'siyle site oluşturma kişisel depolarda token yetkisine takıldığı
# için dağıtım klasik yöntemle yapılır: statik çıktıyı gh-pages dalına it.
on:
  push:
    branches:
      - main
      - claude/whisper-flow-local-setup-l6klf7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /web-site

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          enable_jekyll: false
