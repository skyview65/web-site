name: Deploy to GitHub Pages

# Bu depo Pages alanını başka bir projeyle (LUMENFALL, gh-pages kökü) paylaşıyor.
# Bu yüzden yalnızca dikte uygulamasının dosyaları yayınlanır ve keep_files ile
# daldaki diğer dosyalara dokunulmaz — iki site yan yana yaşar:
#   kök (/web-site/)          → LUMENFALL (başka oturum dağıtır)
#   /web-site/dictation       → Dikte PWA (bu workflow dağıtır)
on:
  push:
    branches:
      - main
      - claude/whisper-flow-local-setup-l6klf7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /web-site

      - name: Select only the dictation app files
        run: |
          mkdir -p publish/icons
          cp out/dictation.html out/dictation.txt out/manifest.webmanifest publish/
          cp -r out/icons/. publish/icons/
          cp -r out/_next publish/_next

      - name: Publish to gh-pages branch (non-destructive)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          keep_files: true
          enable_jekyll: false
