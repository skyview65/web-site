name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # onnxruntime-node (transformers.js bağımlılığı) postinstall'da nuget.org'dan
      # CUDA ikilileri indirmeye çalışıyor ve CI'da ağ zaman aşımıyla patlayabiliyor.
      # Uygulama ONNX'i yalnızca tarayıcıda (WASM/WebGPU) kullanıyor; sunucu tarafı
      # GPU ikilileri gereksiz — indirme atlanıyor.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
