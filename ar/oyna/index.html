ّذ سابق\",\"tagline\":\"الرجل الذي أفلت من المنظومة.\",\"quote\":\"بحسب السجلات الرسمية أنا ميت. والسجلات تكذب دائمًا.\",\"bio\":\"لعشرين عامًا \\\"حلّ المشكلات\\\" في ظل الميثاق — يُسكت من يطرحون الأسئلة الخطأ. ثم في ليلة، كان الشخص المطلوب إسكاته طفلًا. رفض؛ وبحلول الصباح قيّدته السجلات \\\"خسارة تشغيلية\\\". في مصانع حزام الصدأ الصدئة بنى حياة صامتة كالتابوت. لكن حتى الأشباح لا تجد السلام في لومنفول: الملفات القديمة تُفتح من جديد، والأسماء القديمة تعود — وها هو الشبح ينهض من قبره ليصفّي الحساب.\",\"playstyle\":\"قتال تكتيكي · أسلحة ثقيلة · اقتحام — لمن يكسر الأبواب بدل أن يطرقها. كل ساتر قرار، وكل زناد اعتراف.\"},{\"id\":\"solene\",\"name\":\"Solene Adeyemi\",\"role\":\"مهرّبة مدارية\",\"tagline\":\"ملكة السماء الخارجة عن القانون.\",\"quote\":\"الجاذبية اقتراح. الجمارك نكتة. أما كلمتي فعقد.\",\"bio\":\"في الثامنة كانت تعدّ النجوم من مكوك شحن أبيها؛ وفي الثامنة عشرة صارت أصغر طيّارة مرخّصة في الصعود؛ وفي الحادية والعشرين أحرقوا رخصتها — لأنها نقلت عائلة لاجئة بدل صندوق محظور. تعيش اليوم في قمرة اللقلق الأسود، في الفراغ الرمادي بين الشارع والمدار. إلى أن يكشف صندوق شحن واحد أخطر أسرار المدينة — فيسقط مصير لومنفول كلها بين يدي المرأة التي لا تسقط أبدًا.\",\"playstyle\":\"سرعة · إتقان المركبات · هروب مستحيل — لمن يطارد المطاردة نفسها. انقضاضات في أخاديد النيون ومناورات بانعدام الجاذبية.\"}],\"backHref\":\"/ar\"}]]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:I[27201,[\"/web-site/_next/static/chunks/01xlw8hd842-c.js\",\"/web-site/_next/static/chunks/0d3shmwh5_nmn.js\"],\"IconMark\"]\n8:null\n"])</script><script>self.__next_f.push([1,"d:[[\"$\",\"title\",\"0\",{\"children\":\"LUMENFALL — الظلام يتوهّج · 2099\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"عام 2099. ثلاث حيوات ومصير واحد في لومنفول — مدينة عملاقة يحكمها ذكاء اصطناعي. ملحمة جريمة بعالم مفتوح
