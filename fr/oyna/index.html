egarda sa photo en demandant \\\"qui est ce garçon ?\\\", Mara fit un serment : ceux qui font oublier recevront quelque chose qu'ils n'oublieront jamais.\",\"playstyle\":\"Infiltration · hacking · ingénierie sociale — pour qui démonte la ville sans être vu. Chaque caméra est un œil, chaque implant une porte, chaque secret une arme.\"},{\"id\":\"kaan\",\"name\":\"Kaan “Ghost” Demir\",\"role\":\"Ex-exécuteur\",\"tagline\":\"L'homme qui a échappé au système.\",\"quote\":\"D'après les registres officiels, je suis mort. Les registres mentent toujours.\",\"bio\":\"Pendant vingt ans, il a \\\"réglé des problèmes\\\" dans l'ombre du Compact — en faisant taire ceux qui posaient les mauvaises questions. Puis une nuit, la personne à faire taire était un enfant. Il a refusé ; au matin, les registres le déclaraient \\\"perte opérationnelle\\\". Dans les usines rouillées de la Ceinture de Rouille, il s'est bâti une vie silencieuse comme un cercueil. Mais même les fantômes ne trouvent pas la paix à Lumenfall : les vieux dossiers se rouvrent, les vieux noms reviennent — et Ghost sort de sa tombe pour présenter l'addition.\",\"playstyle\":\"Combat tactique · armes lourdes · assaut — pour qui défonce les portes au lieu de frapper. Chaque couvert est une décision, chaque détente une confession.\"},{\"id\":\"solene\",\"name\":\"Solene Adeyemi\",\"role\":\"Contrebandière orbitale\",\"tagline\":\"La reine hors-la-loi du ciel.\",\"quote\":\"La gravité est une suggestion. La douane, une blague. Mais ma parole est un contrat.\",\"bio\":\"À huit ans, elle comptait les étoiles depuis la navette cargo de son père ; à dix-huit, elle était la plus jeune pilote licenciée de l'Ascension ; à vingt et un, on a brûlé sa licence — pour avoir transporté une famille de réfugiés au lieu d'une caisse interdite. Elle vit désormais dans le cockpit de la Cigogne Noire, dans le vide gris entre la rue et l'orbite. Jusqu'au jour où un conteneur révèle le secret le plus dangereux de la ville — et le destin de tout Lumenfall atterrit entre les mains de la femme qui ne tombe jamais.\",\"playstyle\":\"Vitesse · maîtrise des véhicules · évasions impossibles — pour qui poursuit la poursuite. Piqués dans les canyons de néon, manœuvres en zéro-G en orbite.\"}],\"backHref\":\"/fr\"}]]}]]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:I[27201,[\"/web-site/_next/static/chunks/01xlw8hd842-c.js\",\"/web-site/_next/static/chunks/0d3shmwh5_nmn.js\"],\"IconMark\"]\n8:null\n"])</script><script>self.__next_f.push([1,"d:[[\"$\",\"title\",\"0\",{\"children\":\"LUMENFALL — L'obscurité brille · 2099\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"2099. Trois vies, un seul destin à Lumenfall — une mégalopole gouvernée par une IA. Une épopée criminelle en monde ouvert, de la rue jusqu'à l'orbite. Arrive en 2027.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/web-site/seo/site.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://lumenfall.example.com/fr/\"}],[\"$\",\"link\",\"4\",{\"rel\":\"alternate\",\"hrefLang\":\"tr\",\"href\":\"https://lumenfall.example.com/tr/\"}],[\"$\",\"link\",\"5\",{\"rel\":\"alternate\",\"hrefLang\":\"en\",\"href\":\"https://lumenfall.example.com/en/\"}],[\"$\",\"link\",\"6\",{\"rel\":\"alternate\",\"hrefLang\":\"de\",\"href\":\"https://lumenfall.example.com/de/\"}],[\"$\",\"link\",\"7\",{\"rel\":\"alternate\",\"hrefLang\":\"fr\",\"href\":\"https://lumenfall.example.com/fr/\"}],[\"$\",\"link\",\"8\",{\"rel\":\"alternate\",\"hrefLang\":\"es\",\"href\":\"https://lumenfall.example.com/es/\"}],[\"$\",\"link\",\"9\",{\"rel\":\"alternate\",\"hrefLang\":\"it\",\"href\":\"https://lumenfall.example.com/it/\"}],[\"$\",\"link\",\"10\",{\"rel\":\"alternate\",\"hrefLang\":\"pt\",\"href\":\"https://lumenf
